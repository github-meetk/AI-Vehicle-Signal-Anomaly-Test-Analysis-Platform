name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal_user
          POSTGRES_PASSWORD: signal_pass
          POSTGRES_DB: signal_analysis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend evaluation

      - name: Unit tests
        run: pytest backend/tests/test_unit.py -v
        env:
          DATABASE_URL: sqlite:///:memory:

      - name: Integration tests
        run: pytest backend/tests/test_integration.py -v
        env:
          DATABASE_URL: sqlite:///:memory:

      - name: Generate benchmark data
        run: python -m app.simulator.generate --scenarios 50 --seed 42
        working-directory: backend
        env:
          PYTHONPATH: backend

      - name: Run evaluation benchmark
        run: python -m evaluation.run
        env:
          PYTHONPATH: backend:.

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
